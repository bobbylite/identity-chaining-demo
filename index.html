<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="An interactive, fully-simulated walkthrough of cross-domain access for AI agents: how an agent chains a user's identity across trust domains into another company's MCP tools using OAuth token exchange, JWT bearer grants and ID-JAG — with a lab for breaking it on purpose."
    />
    <title>Cross-domain access, live — identity chaining &amp; Cross App Access for AI agents</title>
    <script>
      // Runs before first paint so the page never flashes the wrong theme.
      ;(function () {
        try {
          var stored = localStorage.getItem('xdomain-theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
